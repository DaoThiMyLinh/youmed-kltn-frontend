<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="ymFavCrossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="ymFavLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="ymFavArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="ymFavDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0f172a" flood-opacity="0.2" />
    </filter>
  </defs>

  <g filter="url(#ymFavDrop)">
    <!-- Arc embracing the cross from bottom-left to top-left -->
    <path
      d="M 64 68 C 45 76, 26 66, 26 48 C 26 34, 34 22, 50 16"
      fill="none"
      stroke="url(#ymFavArcGrad)"
      stroke-width="5"
      stroke-linecap="round"
    />

    <!-- Medical Cross Solid Filled (Vivid Medical Blue) -->
    <path
      d="M 40 22 C 40 19.8 41.8 18 44 18 L 56 18 C 58.2 18 60 19.8 60 22 L 60 38 L 76 38 C 78.2 38 80 39.8 80 42 L 80 54 C 80 56.2 78.2 58 76 58 L 60 58 L 60 74 C 60 76.2 58.2 78 56 78 L 44 78 C 41.8 78 40 76.2 40 74 L 40 58 L 24 58 C 21.8 58 20 56.2 20 54 L 20 42 C 20 39.8 21.8 38 24 38 L 40 38 Z"
      fill="url(#ymFavCrossGrad)"
    />

    <!-- White Heartbeat Pulse Cutting Across Cross -->
    <path
      d="M 12 48 L 28 48 L 36 34 L 46 62 L 56 38 L 63 50 L 70 48 L 86 48"
      fill="none"
      stroke="#ffffff"
      stroke-width="4.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Leaf on Upper Left / Top -->
    <path
      d="M 50 16 C 50 24, 40 34, 28 36 C 26 26, 34 16, 50 16 Z"
      fill="url(#ymFavLeafGrad)"
    />
    <!-- Leaf Spine -->
    <path
      d="M 50 16 Q 38 26 28 36"
      fill="none"
      stroke="#ffffff"
      stroke-width="1.8"
      stroke-linecap="round"
      opacity="0.75"
    />
  </g>
</svg>